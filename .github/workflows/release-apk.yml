name: Release APK
on:
  workflow_dispatch:
  push:
    tags: ['v*', 'build-*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path '*outputs/apk/debug/*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/HealthPlan.apk"
          TAG=${GITHUB_REF_NAME}
          if [ "$GITHUB_REF_TYPE" != tag ]; then TAG="build-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" "$GITHUB_WORKSPACE/HealthPlan.apk" --target "$GITHUB_SHA" --title "HealthPlan $TAG" --notes "Автосборка (debug-подпись) из $GITHUB_SHA" || gh release upload "$TAG" "$GITHUB_WORKSPACE/HealthPlan.apk" --clobber
